function img(th,big,opts,atk){
 const n=opts.length,b=opts.map((o,i)=>{const x=Math.round((i+1)*400/(n+1)),l=o.l.split(" (")[0],s=l.length>15?l.slice(0,14)+"…":l;
  return `<g class="z" data-i="${i}"><circle cx="${x}" cy="196" r="22" fill="#1b1410" stroke="#f5c542" stroke-width="2"/><text class="em" x="${x}" y="204">${o.ic}</text><text class="lb" x="${x}" y="236">${s}</text></g>`}).join("");
 const g=BG[th]||BG.carte,bg=`<g ${atk?'class="z" data-i="0"':""}><circle cx="200" cy="100" r="46" fill="#000" opacity=".4"/><text class="bg" x="200" y="120">${big}</text></g>`;
 return `<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x2="0" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient></defs><rect width="400" height="240" fill="url(#g)"/>${th=="fin"||th=="crypte"?"":ST}${TH[th]||""}${bg}${b}</svg>`;}
// ---------- moteur ----------
const has=i=>G.inv.includes(i),bon=s=>G.al.filter(a=>AL[a]==s).length+(s=="es"&&has("talisman")?1:0);
function need(c){if(!c)return true;const m=c.match(/^([a-z]{2})(\d+)$/),k=m[1],n=+m[2];return k=="or"?G.or>=n:k=="al"?G.al.length>=n:G[k]>=n}
function fx(s){(s||"").split(" ").forEach(t=>{const m=t.match(/^([a-z]+)(?:([+-]\d+)|:(.+))$/);if(!m)return;const k=m[1],n=+m[2],v=m[3];
 if(k=="pv")G.pv=Math.min(G.max,G.pv+n);else if(k=="or")G.or=Math.max(0,G.or+n);else if(k=="ho")G.ho=Math.max(-6,Math.min(6,G.ho+n));else if(k=="re")G.re+=n;
 else if(k=="fo"||k=="ru"||k=="es")G[k]=Math.min(5,G[k]+n);else if(k=="it"){if(v=="potion"||!has(v))G.inv.push(v)}else if(k=="al"){if(!G.al.includes(v))G.al.push(v)}});}
function init(){G={mode:"classe",pv:20,max:20,fo:0,ru:0,es:0,or:10,ho:0,re:0,day:0,inv:[],al:[],vis:[],cl:{},tq:TR.map((e,i)=>i).sort(()=>Math.random()-.5),q:[],log:"",en:null,after:"",cont:null,th:"carte",ic:"🏰",txt:"",steps:0};}
function next(){G.log="";if(G.q.length){const s=G.q.shift();ev(s.e,s.th,s.ic)}else map()}
function ev(e,th,ic){G.mode="ev";G.e=e;G.th=th;G.ic=ic;render()}
function map(){G.day++;if(G.day>6)return finale();const left=Object.keys(RG).filter(k=>!G.vis.includes(k));G.offer=[];while(G.offer.length<3&&left.length)G.offer.push(left.splice(R(left.length),1)[0]);G.mode="map";render()}
function go(k){G.vis.push(k);const r=RG[k];G.q=[{e:TR[G.tq.shift()],th:r.th,ic:"🧭"},...r.ev.map(e=>({e,th:r.th,ic:r.ic})),{e:CAMP,th:"camp",ic:"⛺"}];next()}
function choose(c){let ok=true,t,f,tw=null;G.log="";
 if(c[2]){const r=d(20),b=bon(c[2]),cb=c[9]&&G.cl[c[9]]?4:0,tot=r+G[c[2]]+b+cb;ok=tot>=c[3];G.log=`Dé ${r} + ${G[c[2]]+b+cb} (${NM[c[2]]}${cb?", indice utile":""}) = ${tot} contre ${c[3]} : ${ok?"réussite":"échec"}.`}
 t=ok?c[4]:c[6];f=ok?c[5]:c[7];const ts=t.split("|"),i=R(ts.length);t=ts[i];f=(f.split("|")[i]||"").trim();
 if(ok&&!/fi:|ix:/.test(f)&&Math.random()<.22){const w=(TWI[G.th]||[]).filter(x=>!G.cl[x[0]]);if(w.length){tw=pick(w);t+="\n\n"+tw[1];f=(f+" ix:"+tw[0]).trim()}}
 const m=f.match(/ix:(\w+)/);if(m){if(!G.cl[m[1]])G.cl[m[1]]=tw?tw[1]:t;f=f.replace(m[0],"").trim()}
 res(t,f)}
function res(t,f,th){G.txt=t;f=f||"";const m=f.match(/fi:(\S+)/);
 if(m){G.after=f.replace(m[0],"").trim();fight(m[1]);return}
 fx(f);if(G.pv<=0)return die();G.mode="res";render()}
function fight(k){G.en={k,pv:MON[k][2]};G.mode="fight";render()}
function best(){return Math.max(G.fo,G.ru,G.es)}
function attack(){const r=d(20),b=best();let m=`Dé ${r} + ${b}. `;
 if(r+b>=11){const x=d(6)+b+Math.min(G.al.length,2);G.en.pv-=x;m+=`Touché : ${x} dégâts. `}else m+="Raté. ";
 if(G.en.pv<=0){const n=MON[G.en.k][0];if(G.en.k=="boss")G.cont=()=>ending("v");G.en=null;G.log=m;const a=G.after;G.after="";return res(`${n} : vaincu !`,a)}
 eturn(m)}
function eturn(m){const mo=MON[G.en.k];if(d(20)>=12){const x=d(mo[3]);G.pv-=x;m+=`${mo[0]} vous touche : −${x} PV.`}else m+=`${mo[0]} vous rate.`;G.log=m;if(G.pv<=0)return die();render()}
function flee(){const r=d(20),t=r+G.ru+bon("ru");if(t>=12){G.en=null;G.after="";G.log=`Dé ${r} + ${G.ru+bon("ru")} : fuite réussie.`;res("Vous échappez au combat de justesse.","")}else eturn(`Dé ${r} : fuite ratée. `)}
function die(){G.mode="mort";G.en=null;G.txt="Vous tombez au combat. L’obscurité de Malgor gagne Eldoria…";render()}
function finale(){G.mode="fin";G.th="tour";render()}
function boss(w,pre){G.cont=null;G.after="";G.en={k:"boss",pv:MON.boss[2]-(w?10:0)-(G.cl.faille?8:0)};G.after="";G.log=(pre||"")+(G.cl.faille?" La lumière des éclats affaiblit Malgor.":"");G.mode="fight";render()}
function ending(k){G.mode="end";const al=G.al.map(a=>AN[a]);let ti,t;
 if(k=="v"){if(G.ho>=3){ti="Légende d’Eldoria";t="Malgor s’effondre. Vous brandissez l’Amulette et le peuple en larmes vous acclame comme une légende vivante."}else if(G.ho>=-1){ti="Le Héros du royaume";t="Malgor est vaincu. L’Amulette retrouve sa lumière et l’aube se lève enfin sur Eldoria."}else{ti="L’ombre du vainqueur";t="Malgor est vaincu, mais l’Amulette vous murmure à l’oreille. Vous la gardez. Le royaume est sauvé… et vous le tenez sous votre botte."}}
 else if(k=="p"){ti="La paix d’Aube";t="Malgor, ébranlé par vos mots, rend l’Amulette et part en exil. Plus une goutte de sang ne coule."}
 else if(k=="r"){if(G.re>=5){ti="L’Aube éclatante";t="Les éclats s’embrasent et reforment l’Amulette, plus pure encore. Malgor, purifié, tombe à genoux."}else{ti="L’Aube amère";t="Les éclats s’assemblent, mais il en manque. L’Amulette brille faiblement : l’aube reviendra, lentement, au prix de bien des sacrifices."}}
 else if(k=="n"){ti="Le retour d’Aldric";t="Au nom d’Aldric, le sceptre de Malgor se brise. Le vieux mage pleure, l’Amulette se reforme entre vos mains et l’aube se lève sans combat."}
 else{ti="Le règne des ombres";t="Vous offrez les éclats à Malgor. Ensemble, vous régnez sur une Eldoria plongée dans une nuit éternelle."}
 if(al.length)t+=` ${al.join(", ")} ${al.length>1?"restent":"reste"} à vos côtés.`;if(G.or>=40)t+=" Votre bourse pleine fait de vous l’un des plus riches du royaume.";
 G.txt=`★ ${ti} ★\n\n${t}\n\nÉclats rassemblés : ${G.re}. Honneur : ${G.ho}. Lieux visités : ${G.vis.map(k=>RG[k].n).join(", ")}.`;render()}
function drink(){G.inv.splice(G.inv.indexOf("potion"),1);G.pv=Math.min(G.max,G.pv+8);if(G.mode=="fight")eturn("Vous buvez une potion. ");else{G.log="Vous récupérez des PV.";render()}}
function stats(){const jo=$("jr").querySelector&&$("jr").querySelector("details"),op=jo&&jo.open,k=Object.keys(G.cl);$("jr").innerHTML=k.length?`<details ${op?"open":""}><summary># 📜 journal_indices (${k.length}/5)</summary>${Object.values(G.cl).map(x=>"<p>"+x.replace(/\n+/g," ")+"</p>").join("")}</details>`:"";$("st").innerHTML=`<span class="c"># état du joueur</span>`+[["pv",`${Math.max(G.pv,0)} / ${G.max}`],["force",G.fo],["ruse",G.ru],["esprit",G.es],["or",G.or],["honneur",G.ho],["eclats",G.re],["jour",`${Math.min(G.day,6)} / 6`],["sac",`[${G.inv.map(i=>'"'+i+'"').join(", ")}]`]].concat(G.al.length?[["allies",`[${G.al.map(a=>'"'+AN[a]+'"').join(", ")}]`]]:[]).map(([k,v])=>`<span><i class="k">${k}</i> = <b class="n">${v}</b></span>`).join("")}
function render(){G.steps++;stats();let o=[],th=G.th,big=G.ic,t=G.txt,atk=0;const m=G.mode;
 if(m=="classe"){th="carte";big="🏰";t="Le royaume d’Eldoria sombre dans la nuit : Malgor a brisé l’Amulette d’Aube. Ses éclats sont dispersés. Ramenez-les, ou trouvez un autre moyen de l’arrêter. Qui êtes-vous ?";
  o=Object.values(CLS).map(c=>({l:c[0]+" (Force "+c[2]+", Ruse "+c[3]+", Esprit "+c[4]+")",ic:c[1],fn:()=>{G.fo=c[2];G.ru=c[3];G.es=c[4];G.pv=G.max=c[5];G.inv=[...c[6]];G.mode="comp";render()}}))}
 else if(m=="comp"){th="carte";big="🧭";t="Voyagez-vous seul ?";
  o=[["nain","⛏️"],["elfe","🧝"],["barde","🎻"],["","🚶"]].map(([a,ic])=>({l:a?"Partir avec "+AN[a]:"Partir seul (+10 pièces)",ic,fn:()=>{if(a)G.al.push(a);else G.or+=10;map()}}))}
 else if(m=="map"){th="carte";big="🗺️";t=`Jour ${G.day} sur 6. Où allez-vous ?`;o=G.offer.map(k=>({l:RG[k].n,ic:RG[k].ic,fn:()=>go(k)}))}
 else if(m=="ev"){t=G.e[0];o=G.e[1].filter(c=>need(c[8])).map(c=>({l:(c[9]&&G.cl[c[9]]?"💡 ":"")+c[0],ic:c[1],fn:()=>choose(c)}))}
 else if(m=="res"){o=[{l:"Continuer",ic:"➡️",fn:()=>{const c=G.cont;G.cont=null;c?c():next()}}]}
 else if(m=="fight"){const mo=MON[G.en.k];big=mo[1];t=`${mo[0]} (${G.en.pv} PV) vous fait face !`;atk=1;o=[{l:"Attaquer",ic:"⚔️",fn:attack}];if(G.en.k!="boss")o.push({l:"Fuir",ic:"🏃",fn:flee})}
 else if(m=="fin"){th="tour";big="🗼";t="Six jours ont passé. La tour de Malgor se dresse devant vous, noire contre le ciel. Comment l’affronter ?";
  o=[{l:"Assaut frontal",ic:"⚔️",fn:()=>{G.cont=()=>boss(0,"");res("Vous enfoncez les portes. Une garde noire vous barre la route.","fi:garde");G.cont=()=>boss(0,"")}}];
  if(G.ru>=2)o.push({l:"S’infiltrer (Ruse)",ic:"🥷",fn:()=>{const r=d(20),tt=r+G.ru+bon("ru"),ok=tt>=13;G.log=`Dé ${r} + ${G.ru+bon("ru")} = ${tt} contre 13.`;if(ok){G.cont=()=>boss(1,"");res("Vous glissez dans l’ombre jusqu’au sommet. Malgor ne vous voit pas venir.","")}else{G.cont=()=>boss(0,"");res("Découvert !","pv-3 fi:garde");G.cont=()=>boss(0,"")}}});
  if(G.es>=2)o.push({l:"Négocier (Esprit)",ic:"🕊️",fn:()=>{const r=d(20),tt=r+G.es+bon("es")+G.al.length,ok=tt>=14;G.log=`Dé ${r} + ${G.es+bon("es")+G.al.length} = ${tt} contre 14.`;if(ok)ending("p");else{G.cont=()=>boss(0,"");res("Malgor éclate de rire. « Assez parlé ! »","")}}});
  if(G.cl.passage)o.push({l:"Passage des marais",ic:"🚪",fn:()=>{G.cont=()=>boss(1,"");res("Vous trouvez la porte oubliée sous la tour. Aucun garde ne vous voit.","")}});
  if(G.cl.nom)o.push({l:"Prononcer le nom d’Aldric",ic:"📛",fn:()=>{const r=d(20),v=G.es+bon("es")+4,tt=r+v;G.log=`Dé ${r} + ${v} = ${tt} contre 12.`;if(tt>=12)ending("n");else{G.cont=()=>boss(0,"");res("Malgor rugit : « Ce nom est mort ! »","")}}});
  if(G.re>=(G.cl.faille?2:3))o.push({l:"Rituel des éclats",ic:"✨",fn:()=>ending("r")});
  if(G.ho<=-2)o.push({l:"Offrir les éclats à Malgor",ic:"🖤",fn:()=>ending("s")})}
 else if(m=="end"){th="fin";big="🌅";o=[{l:"Nouvelle aventure",ic:"🔄",fn:()=>{init();render()}}]}
 else{th="mort";big="🪦";o=[{l:"Recommencer l’aventure",ic:"🔄",fn:()=>{init();render()}}]}
 if(has("potion")&&G.pv<G.max&&["ev","map","fight"].includes(m))o.push({l:"Boire une potion (+8 PV)",ic:"🧪",fn:drink});
 G.opts=o;$("im").innerHTML=img(th,big,o,atk);$("tx").textContent=t;$("lg").textContent=G.log;
 $("ch").innerHTML="";o.forEach((c,i)=>{const b=document.createElement("button");const p=document.createElement("span");p.className="fn";p.textContent=">>>";b.append(p," "+(i+1)+". "+c.ic+" "+c.l);b.onclick=c.fn;$("ch").appendChild(b)})}
$("im").onclick=e=>{const z=e.target.closest("[data-i]");if(z&&G.opts[+z.dataset.i])G.opts[+z.dataset.i].fn()};
